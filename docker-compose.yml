services:
  mcp-mysql:
    image: askdba/mcp-server-mysql:latest
    restart: unless-stopped

  dataseai:
    image: dataseai:dev
    build: .
    ports:
      - "53306:53306"
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      MYSQLWEB_MCP_COMMAND: "sh -c 'docker exec mcp-mysql node /app/dist/index.js'"
    depends_on:
      - mcp-mysql
    restart: unless-stopped
